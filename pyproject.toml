[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-user-cli"
version = "0.1.0"
description = "Let your agent use your Telegram account from the terminal."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Artem Getman"}]
dependencies = ["Telethon==1.43.2", "python-dotenv==1.2.1"]

[project.urls]
Repository = "https://github.com/artemgetmann/telegram-user-cli"
Issues = "https://github.com/artemgetmann/telegram-user-cli/issues"

[project.scripts]
telegram-user = "telegram_user_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telegram_user_cli = ["SKILL.md"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
